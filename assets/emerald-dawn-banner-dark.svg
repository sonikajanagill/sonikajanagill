<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Sonika Janagill, Google Developer Expert in Cloud AI and Google Cloud. Build with AI. Know when not to.">
  <!-- Emerald Dawn banner (dark). Mirrors the sonikajanagill.com homepage hero. -->
  <style>
    .spin { animation: spin 10s linear infinite; }
    .flow { stroke-dasharray: 10 400; animation: flow 4s linear infinite; }
    .halo { transform-origin: 1060px 150px; animation: halo 5s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes flow { from { stroke-dashoffset: 10; } to { stroke-dashoffset: -400; } }
    @keyframes halo { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.12); opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { .spin, .flow, .halo { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2838"/>
      <stop offset="0.75" stop-color="#1F323A"/>
      <stop offset="1" stop-color="#0E1713"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- Hills -->
    <path d="M0 250 Q200 214 400 240 T820 236 T1200 246 V320 H0 Z" fill="#16221C"/>
    <path d="M0 272 Q170 240 370 262 T750 258 Q990 240 1200 270 V320 H0 Z" fill="#121C17"/>
    <path d="M0 294 Q280 268 660 288 T1200 284 V320 H0 Z" fill="#0F1813"/>

    <!-- Turbines -->
    <g stroke="#5FB7C4" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
      <line x1="560" y1="232" x2="560" y2="276"/><g class="spin" style="transform-origin:560px 232px;animation-duration:10s"><line x1="560" y1="232" x2="560" y2="212"/><line x1="560" y1="232" x2="577" y2="244"/><line x1="560" y1="232" x2="543" y2="244"/><circle cx="560" cy="232" r="2.5" fill="#5FB7C4"/></g>
      <line x1="700" y1="222" x2="700" y2="272"/><g class="spin" style="transform-origin:700px 222px;animation-duration:8s"><line x1="700" y1="222" x2="700" y2="198"/><line x1="700" y1="222" x2="721" y2="236"/><line x1="700" y1="222" x2="679" y2="236"/><circle cx="700" cy="222" r="2.5" fill="#5FB7C4"/></g>
      <line x1="840" y1="238" x2="840" y2="270"/><g class="spin" style="transform-origin:840px 238px;animation-duration:12s"><line x1="840" y1="238" x2="840" y2="220"/><line x1="840" y1="238" x2="856" y2="249"/><line x1="840" y1="238" x2="824" y2="249"/><circle cx="840" cy="238" r="2.5" fill="#5FB7C4"/></g>
    </g>

    <!-- Leaf-circuit trace on the near hill -->
    <g stroke="#5FB7C4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
      <path d="M60 300 H170 L194 288 H260"/>
      <path d="M260 288 Q260 270 282 264 Q287 283 268 291 Q263 292 260 288 Z"/>
    </g>
    <circle cx="60" cy="300" r="3" fill="#5FB7C4" opacity="0.7"/>
    <path class="flow" d="M60 300 H170 L194 288 H260" stroke="#4FC3A1" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Sun behind the split circuit-tree -->
    <circle class="halo" cx="1060" cy="150" r="71" fill="none" stroke="#E27D3A" stroke-width="1.5"/>
    <circle cx="1060" cy="150" r="56" fill="#E27D3A"/>
    <g transform="translate(1060 227) scale(0.55)" stroke="#5FB7C4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 -255 A115 115 0 0 0 0 -25 Z" fill="#16221C"/>
      <path d="M0 -255 A115 115 0 0 1 0 -25" stroke-dasharray="3 8" opacity="0.7"/>
      <path d="M0 82 V-250"/>
      <path d="M0 -72 Q-30 -80 -62 -86 M0 -102 Q-36 -116 -72 -132 M0 -136 Q-22 -156 -36 -178 M0 -170 Q-10 -196 -18 -214"/>
      <path d="M0 0 Q0 -22 22 -30 Q24 -8 4 0 Q1 1 0 0 Z" transform="translate(-104 -146) rotate(-50)" fill="#121C17"/>
      <path d="M0 0 Q0 -22 22 -30 Q24 -8 4 0 Q1 1 0 0 Z" transform="translate(-86 -192) rotate(-15)" fill="#C9B8E8"/>
      <path d="M0 0 Q0 -22 22 -30 Q24 -8 4 0 Q1 1 0 0 Z" transform="translate(-48 -214) rotate(5)" fill="#0F1813"/>
      <path d="M0 0 Q0 -22 22 -30 Q24 -8 4 0 Q1 1 0 0 Z" transform="translate(-96 -98) rotate(-80)" fill="#0F1813"/>
      <path d="M0 0 Q0 -22 22 -30 Q24 -8 4 0 Q1 1 0 0 Z" transform="translate(-72 -138) rotate(-30)" fill="#F2A05F"/>
      <path d="M0 0 Q0 -22 22 -30 Q24 -8 4 0 Q1 1 0 0 Z" transform="translate(-40 -174) rotate(0)" fill="#121C17"/>
      <path d="M0 0 Q0 -22 22 -30 Q24 -8 4 0 Q1 1 0 0 Z" transform="translate(-72 -80) rotate(-65)" fill="#C9B8E8"/>
      <path d="M0 0 Q0 -22 22 -30 Q24 -8 4 0 Q1 1 0 0 Z" transform="translate(-32 -116) rotate(-20)" fill="#0F1813"/>
      <path d="M0 0 Q0 -22 22 -30 Q24 -8 4 0 Q1 1 0 0 Z" transform="translate(-20 -202) rotate(25)" fill="#C9B8E8"/>
      <path d="M0 0 Q0 -22 22 -30 Q24 -8 4 0 Q1 1 0 0 Z" transform="translate(-24 -76) rotate(-40)" fill="#121C17"/>
      <path d="M0 -72 H44 L62 -90 H104 M0 -100 H28 L56 -128 H112 M0 -128 H14 L40 -154 H92 M0 -156 L24 -180 V-208 M0 -184 H10 L30 -204 H64 L80 -220 M0 -212 L18 -230"/>
      <path d="M104 -90 L112 -128 L92 -154 L80 -220 M24 -208 L92 -154 M64 -204 L92 -154" opacity="0.5" stroke-dasharray="1 5"/>
      <path d="M112 -128 H176 M104 -90 L120 -74 H186 M92 -154 L110 -172 H160" opacity="0.6"/>
      <circle cx="104" cy="-90" r="5" fill="#C9B8E8"/><circle cx="112" cy="-128" r="5" fill="#16221C"/><circle cx="92" cy="-154" r="5" fill="#C9B8E8"/>
      <circle cx="24" cy="-208" r="5" fill="#16221C"/><circle cx="80" cy="-220" r="5" fill="#C9B8E8"/><circle cx="18" cy="-230" r="5" fill="#16221C"/>
      <g fill="#5FB7C4" stroke="none"><circle cx="62" cy="-90" r="2.5"/><circle cx="56" cy="-128" r="2.5"/><circle cx="40" cy="-154" r="2.5"/><circle cx="30" cy="-204" r="2.5"/><circle cx="176" cy="-128" r="2.5"/><circle cx="186" cy="-74" r="2.5"/><circle cx="160" cy="-172" r="2.5"/></g>
      <g stroke="#4FC3A1" stroke-width="3">
        <path class="flow" d="M0 60 V-72 H44 L62 -90 H104"/>
        <path class="flow" style="animation-delay:1.5s" d="M0 -100 H28 L56 -128 H176"/>
        <path class="flow" style="animation-delay:2.9s" d="M0 -184 H10 L30 -204 H64 L80 -220"/>
      </g>
    </g>

    <!-- Status pill -->
    <rect x="60" y="44" width="494" height="32" rx="16" fill="#1A2A22" fill-opacity="0.7" stroke="#4FC3A1" stroke-opacity="0.35"/>
    <circle cx="80" cy="60" r="4" fill="#4FC3A1"/>
    <text x="94" y="65" textLength="440" lengthAdjust="spacingAndGlyphs" font-family="'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#E4EEE8">GOOGLE DEVELOPER EXPERT · CLOUD AI &amp; GOOGLE CLOUD</text>

    <!-- Name and promise -->
    <text x="58" y="146" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="60" letter-spacing="-1.5" fill="#E4EEE8">Sonika Janagill</text>
    <text x="60" y="194" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#4FC3A1">Build with AI. Know when not to.</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#22352B" stroke-width="1.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Sonika Janagill — Emerald Dawn banner">
  <defs>
    <clipPath id="card">
      <rect width="1200" height="260" rx="24"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAE0C8"/>
      <stop offset="100%" stop-color="#BFDDE4"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="url(#sky)"/>

    <!-- Sun, top right, clear of text and hills -->
    <circle cx="1030" cy="86" r="44" fill="#F2A05F" opacity="0.92"/>
    <circle cx="1030" cy="86" r="61" fill="none" stroke="#F2A05F" stroke-width="1.5" opacity="0.4"/>

    <!-- Far hills -->
    <path d="M0 172 Q200 138 420 158 T840 154 T1200 162 V260 H0 Z" fill="#DDE9E1"/>

    <!-- Mid hills -->
    <path d="M0 198 Q180 172 380 188 T760 184 Q980 172 1200 194 V260 H0 Z" fill="#C8DCCC"/>

    <!-- Turbines, right of the sun's shadow, well clear of the text column (x < 820) -->
    <g stroke="#16808F" stroke-width="1.5" stroke-linecap="round" fill="none">
      <line x1="900" y1="168" x2="900" y2="212"/>
      <line x1="900" y1="168" x2="900" y2="146"/>
      <line x1="900" y1="168" x2="918" y2="180"/>
      <line x1="900" y1="168" x2="882" y2="180"/>
      <circle cx="900" cy="168" r="2.5" fill="#16808F"/>
      <line x1="1000" y1="182" x2="1000" y2="216"/>
      <line x1="1000" y1="182" x2="1000" y2="162"/>
      <line x1="1000" y1="182" x2="1016" y2="192"/>
      <line x1="1000" y1="182" x2="984" y2="192"/>
      <circle cx="1000" cy="182" r="2.5" fill="#16808F"/>
    </g>

    <!-- Leaf-circuit trace, low on the hill, between the text column and the turbines -->
    <g stroke="#16808F" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M680 226 H730 L750 214 H790"/>
      <circle cx="680" cy="226" r="2.5" fill="#16808F" stroke="none"/>
      <path d="M790 214 Q790 198 806 192 Q810 208 796 214 Q792 216 790 214 Z" fill="#DDE9E1"/>
    </g>

    <!-- Near hill -->
    <path d="M0 214 Q260 190 560 206 T1200 202 V260 H0 Z" fill="#AFCEB7"/>

    <!-- Text -->
    <text x="60" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="500" fill="#17251E">Sonika Janagill</text>
    <text x="60" y="146" font-family="Verdana, Geneva, sans-serif" font-size="19" font-weight="600" fill="#0F8A6D">Google Developer Expert &#183; Cloud AI &amp; Google Cloud</text>
    <text x="60" y="174" font-family="Verdana, Geneva, sans-serif" font-size="15" fill="#4E6459">Lead Backend Engineer at VML &#183; Data/MLOps Engineer &#183; Watford, UK</text>

    <!-- SJ monogram watermark, bottom-right -->
    <g transform="translate(1108,196)">
      <circle cx="30" cy="30" r="26" fill="#F4F7F3" stroke="#0F8A6D" stroke-width="2"/>
      <text x="30" y="39" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="500" fill="#0F8A6D">SJ</text>
    </g>
  </g>

  <!-- Card border -->
  <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="23.25" fill="none" stroke="#DCE5DD" stroke-width="1.5"/>
</svg>
